[project]
name = "game"
version = "0.1.0"
description = "2049 -- Mines of Merge: a minesweeper/2048 roguelike"
readme = "README.md"
authors = [
    { name = "Sebastian Korotkiewicz", email = "skorotkiewicz@gmail.com" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "requests>=2.34.2",
]

[project.scripts]
game = "game:main"
game-web = "game.webserve:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
